[tool.poetry]
name = "leadmend-backend"
version = "0.1.0"
description = "LeadMend backend service"
authors = ["LeadMend Team"]
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.23.2"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.23"}
asyncpg = "^0.29.0"
httpx = "^0.25.1"
tenacity = "^8.2.3"
structlog = "^23.2.0"
python-dotenv = "^1.0.0"
pydantic-settings = "^2.1.0"
email-validator = "^2.1.0"
ruff = "^0.1.4"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
pytest-httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
