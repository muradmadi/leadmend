name: 🐛 Bug Report
description: File a structured report to help us reproduce and fix a bug.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🛡️ Help us squash this bug!
        Please provide as much detail as possible to help us understand the issue.
  - type: textarea
    id: summary
    attributes:
      label: 📝 Summary
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 🔄 Reproduction Steps
      description: How can we reproduce this bug?
      placeholder: |
        1. Start the services using `make dev`
        2. Navigate to...
        3. Click on...
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 🎯 Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: ❌ Actual Behavior
      description: What actually happened?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 💻 Environment
      description: OS, Browser, Python version, etc.
    validations:
      required: true
