name: 💡 Feature Request
description: Propose a new feature or architectural improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🚀 Propose a new feature!
        Focus on the business logic or workflow problem this feature solves.
  - type: textarea
    id: problem
    attributes:
      label: ❓ What problem does this solve?
      description: Explain the "Why" behind this feature. What bottleneck or pain point is being addressed?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: ✨ Proposed Solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 🔄 Alternatives Considered
      description: Any alternative solutions or features you've considered.
  - type: textarea
    id: context
    attributes:
      label: 📖 Additional Context
      description: Add any other context or screenshots about the feature request here.
